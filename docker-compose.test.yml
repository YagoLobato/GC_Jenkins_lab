name: conversor-test

services:
  test:
    image: maven:3.9-eclipse-temurin-21
    container_name: conversor-test
    working_dir: /app
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    command: mvn -B test -Dmaven.test.failure.ignore=true

volumes:
  maven-cache:
    name: jenkins-maven-cache